    <!-- Boot stage: painted before the bundle runs so the first frame is never a void.
         React replaces everything inside #root on mount. -->
    <style>
      html, body, #root { background: #04060e; margin: 0; padding: 0; }
      .boot-stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(ellipse 70% 55% at 50% 34%, rgba(8,145,178,0.22), transparent 65%),
                    radial-gradient(ellipse 60% 50% at 78% 78%, rgba(124,58,237,0.18), transparent 60%), #04060e; }
      .boot-disc, .boot-halo { position: absolute; left: 50%; border-radius: 50%; pointer-events: none; }
      .boot-disc { top: 58%; width: min(560px, 92vmin); height: min(560px, 92vmin);
        transform: translate(-50%, -50%) rotateX(74deg);
        background: repeating-radial-gradient(circle at 50% 50%, rgba(103,232,249,0.09) 0 1px, transparent 1px 16px);
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 22%, transparent 70%);
        mask-image: radial-gradient(circle at 50% 50%, #000 22%, transparent 70%);
        animation: boot-spin 22s linear infinite; }
      .boot-halo { top: 46%; width: min(340px, 62vmin); height: min(340px, 62vmin);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(34,211,238,0.28), rgba(124,58,237,0.12) 55%, transparent 72%);
        filter: blur(26px); animation: boot-breathe 4.6s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: translate(-50%, -50%) rotateX(74deg) rotateZ(360deg); } }
      @keyframes boot-breathe { 0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: .35; }
                                50% { transform: translate(-50%, -50%) scale(1.12); opacity: .75; } }
      .boot-status { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%);
        font: 500 12px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: .12em;
        text-transform: uppercase; color: rgba(165, 243, 252, .72); white-space: nowrap; }
      .boot-status:empty { display: none; }
      @media (prefers-reduced-motion: reduce) { .boot-disc, .boot-halo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-stage" aria-hidden="true">
        <div class="boot-disc"></div>
        <div class="boot-halo"></div>
        <div class="boot-status" id="boot-status"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
