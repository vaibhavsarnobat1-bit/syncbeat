<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncBeat</title>
    <style>
      html, body { height: 100%; margin: 0; background: #060708; color: #e8ecf4;
        font-family: system-ui, -apple-system, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; text-align: center; }
      img { width: 96px; height: 96px; }
      button { background: #22d3ee; color: #04060e; border: 0; border-radius: 10px;
        padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
      p { color: #9aa4b2; max-width: 30ch; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icon.png" alt="SyncBeat" onerror="this.style.display='none'" />
      <h1>SyncBeat is offline</h1>
      <p>The app could not reach the SyncBeat server. Check your connection, then try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
