# Koyeb Deployment Configuration for SyncBeat
# 24/7 Always-On, No Sleep, No Cold Start, Full WebSocket Support
name: syncbeat
services:
  - name: syncbeat-web
    git:
      repository: github.com/vaibhavsarnobat1-bit/syncbeat
      branch: master
      workdir: home/runner/workspace
      build_command: pnpm install && pnpm run build
      run_command: cd artifacts/api-server && node dist/index.cjs
    instance_type: nano
    ports:
      - port: 3001
        path: /
    routes:
      - path: /
        port: 3001
    env:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET
        value: Vaibhav@2004
      - key: PORT
        value: "3001"
