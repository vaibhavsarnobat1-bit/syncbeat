name: Keep SyncBeat Alive (Render Ping)

on:
  schedule:
    # Ping every 5 minutes — keeps Render free tier from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SyncBeat Server
        run: |
          echo "Pinging SyncBeat at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://syncbeat-vaibhav.onrender.com/api/healthz)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is UP!"
          else
            echo "⚠️ Server returned $STATUS — may be waking up"
          fi
